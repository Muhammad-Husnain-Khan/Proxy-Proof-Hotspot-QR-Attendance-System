<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Mark Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Mark Attendance</h1>
        <p>Proximity Verification Required</p>

        <form action="{{ url_for('main.mark_attendance') }}" method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="form-group">
                <label for="roll_number">University Roll Number</label>
                <input type="text" 
                       name="roll_number" 
                       id="roll_number" 
                       placeholder="e.g. XXL-XXXX" 
                       pattern="[0-9]{2}L-[0-9]{4}"
                       title="Please enter in format: XXL-XXXX (e.g. XXL-XXXX)"
                       required>
            </div>

            <button type="submit" class="btn">Confirm Attendance</button>
        </form>

        <p style="font-size: 0.75rem; margin-top: 2rem; opacity: 0.6;">
            Note: You must be connected to the teacher's Wi-Fi Hotspot for submission to work.
        </p>
    </div>
</body>
</html>
