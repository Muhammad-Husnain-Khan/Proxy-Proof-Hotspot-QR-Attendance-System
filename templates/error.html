<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="status-icon error-icon">✕</div>
        <h1>Access Denied</h1>
        <p>{{ message }}</p>
        <p style="font-size: 0.8rem;">Please ensure you scan the most recent QR code while connected to the correct network.</p>
        <a href="javascript:history.back()" class="btn" style="text-decoration: none; display: block; margin-top: 1rem;">Try Again</a>
    </div>
</body>
</html>
